backend:
  name: github
  repo: id5skyhunter/maiden
  branch: main
  auth_methods: [token]

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "operators"
    label: "Operators"
    folder: "content/operators"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Operator ID", name: "id", widget: "string" }
      - { label: "Operator Name", name: "name", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Overall Status", name: "status", widget: "select", options: ["Available", "Busy"], default: "Available" }
      - { label: "Average Rating (out of 5)", name: "rating", widget: "number", value_type: "float", default: 4.5 }
      - { label: "Rating Count", name: "ratingCount", widget: "number", value_type: "int", default: 1200 }
      - { label: "Favorites Count", name: "favorites", widget: "number", value_type: "int", default: 523100 }
      - label: "Operator Versions"
        name: "versions"
        widget: "list"
        fields:
          - { label: "Version ID (e.g. dg, wb)", name: "versionId", widget: "string" }
          - { label: "Version Name", name: "versionName", widget: "string" }
          - { label: "Model Code", name: "code", widget: "string" }
          - { label: "Version Status", name: "status", widget: "select", options: ["Available", "Busy"], default: "Available" }
          - { label: "Affiliation", name: "affiliation", widget: "string", default: "Hyperion" }
          - { label: "Tag / Persona Style", name: "tag", widget: "string", default: "Tactical" }
          - { label: "Acquisition Price (Credits)", name: "price", widget: "number", value_type: "int" }
          - { label: "Character Cutout Image", name: "image", widget: "image" }
          - { label: "Box / Packaging Image", name: "boxImage", widget: "image" }
          - { label: "Quote / Motto", name: "quote", widget: "string" }
          - { label: "Overview & Description", name: "description", widget: "text" }
          - label: "RPG Combat Stats (Max 255)"
            name: "stats"
            widget: "object"
            fields:
              - { label: "STR", name: "str", widget: "number", min: 1, max: 255, default: 240 }
              - { label: "AGI", name: "agi", widget: "number", min: 1, max: 255, default: 240 }
              - { label: "INT", name: "int", widget: "number", min: 1, max: 255, default: 240 }
              - { label: "PWR", name: "pwr", widget: "number", min: 1, max: 255, default: 240 }
              - { label: "DEF", name: "def", widget: "number", min: 1, max: 255, default: 240 }
              - { label: "SYNC", name: "sync", widget: "number", min: 1, max: 255, default: 250 }
          - label: "CV & Dossier Credentials"
            name: "cv"
            widget: "object"
            fields:
              - { label: "Learning Model", name: "learningModel", widget: "string" }
              - { label: "Generation", name: "generation", widget: "string" }
              - { label: "Activation Date", name: "activationDate", widget: "string" }
              - { label: "Specializations", name: "specializations", widget: "list" }
              - label: "Work Experience"
                name: "workExperience"
                widget: "list"
                fields:
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Organization", name: "org", widget: "string" }
                  - { label: "Period", name: "period", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string" }
              - { label: "Certifications", name: "certifications", widget: "list" }
          - label: "Combat & Operational Abilities"
            name: "abilities"
            widget: "list"
            fields:
              - { label: "Ability Name", name: "name", widget: "string" }
              - { label: "Description", name: "desc", widget: "string" }

  - name: "posts"
    label: "News & PR Blog"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Post Slug / ID", name: "id", widget: "string" }
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Press Release", "Product Update", "Vision & Keynote", "Event", "Notice"] }
      - { label: "Publish Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "MAIDEN Public Relations" }
      - { label: "Read Time", name: "readTime", widget: "string", default: "3 min read" }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false }
      - { label: "Summary Excerpt", name: "excerpt", widget: "text" }
      - { label: "Full Content (Markdown)", name: "content", widget: "markdown" }
